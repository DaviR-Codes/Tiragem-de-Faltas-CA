<!DOCTYPE html>

        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 20px; letter-spacing: 1px; font-size: 22px; text-decoration: underline; }

        .voltar:hover { background: #2c3e50; color: #fff; }

        /* Estilo para quebras de linha dentro da célula */
        td { white-space: pre-line; } 
    </style>
</head>

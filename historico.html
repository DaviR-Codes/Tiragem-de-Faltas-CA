<style>
    .relatorio-card { 
        border: 2px solid #2c3e50; 
        margin-bottom: 20px; 
        padding: 15px; 
        background: white;
    }
    .status-ausente { color: #c0392b; font-weight: bold; }
    .status-presente { color: #27ae60; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; }
</style>

<div id="container-relatorios"></div>

<script>
    const relatorios = JSON.parse(localStorage.getItem('relatorios') || "[]");
    const container = document.getElementById('container-relatorios');

    relatorios.forEach(rel => {
        let htmlAusentes = rel.ausentes.map(a => 
            `<tr><td>${a.nome}</td><td class="status-ausente">AUSENTE</td><td>${a.motivo}</td></tr>`
        ).join('');

        container.innerHTML += `
            <div class="relatorio-card">
                <h3>RELATÓRIO DE FALTAS - ${rel.data} (${rel.turno})</h3>
                <table>
                    <thead>
                        <tr><th>Militar</th><th>Status</th><th>Justificativa</th></tr>
                    </thead>
                    <tbody>
                        ${htmlAusentes}
                        <tr><td colspan="3"><strong>Presentes:</strong> ${rel.presentes}</td></tr>
                    </tbody>
                </table>
            </div>
        `;
    });
</script>
